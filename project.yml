name: SahaSatis

# .xcodeproj repoya girmez; CI'da `xcodegen generate` ile üretilir.
# Info.plist dosyaları ve widget yetkileri Generated/ altında üretilir (git'e girmez).
# Uygulama yetkileri yapılandırmaya göre değiştiği için Config/ altında elle tutulur.

# FreeDevice: ücretsiz Apple ID (Personal Team) ile kendi iPhone'una kurulum (docs/MAC_KURULUM.md).
# Release türünde (DEBUG kodu ve örnek veri derlenmez); iCloud/CloudKit ve Sign in with Apple yetkisi yok.
configs:
  Debug: debug
  Release: release
  FreeDevice: release

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: tr
  generateEmptyDirectories: true

# ---------------------------------------------------------------------------
# TEK YERDEN AYAR: Apple Developer hesabı onaylanınca aşağıdaki üç kimliği
# Identifiers sayfasında oluşturduğun değerlerle değiştir (README / SPEC'e bak).
# Entitlements ve Info.plist bu değerlere $(...) ile başvurur.
# ---------------------------------------------------------------------------
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_BUNDLE_ID: com.example.sahasatis
    APP_GROUP_ID: group.com.example.sahasatis
    ICLOUD_CONTAINER_ID: iCloud.com.example.sahasatis
  configs:
    FreeDevice:
      APP_BUNDLE_ID: com.kadyxx.sahasatis
      APP_GROUP_ID: group.com.kadyxx.sahasatis

targets:
  SahaSatis:
    type: application
    platform: iOS
    sources:
      - SahaSatis
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Config/SahaSatis.entitlements
      configs:
        FreeDevice:
          CODE_SIGN_ENTITLEMENTS: Config/SahaSatis-FreeDevice.entitlements
    info:
      path: Generated/SahaSatis-Info.plist
      properties:
        CFBundleDisplayName: Saha Satış
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations:
          - tr
        NSCameraUsageDescription: Kartvizitleri okuyup kişi ve müşteri bilgilerini doldurmak için kamera kullanılır. Görüntü cihazınızdan çıkmaz ve kaydedilmez.
        NSMicrophoneUsageDescription: Ziyaret notlarını sesle kaydedebilmeniz için mikrofona erişim gerekir. Ses yalnızca konuşmayı metne çevirmek için kullanılır.
        NSSpeechRecognitionUsageDescription: Sesli ziyaret notunuzu Türkçe metne çevirmek için konuşma tanıma kullanılır.
        UILaunchScreen: {}
        # Widget derin bağlantıları: sahasatis://task/<uuid>, sahasatis://today, sahasatis://visit/new
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes:
              - sahasatis
        # Günlük bildirim yenileme (BGAppRefreshTask). Kimlik BackgroundRefresh.identifier ile aynı: <bundle id>.refresh
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(APP_BUNDLE_ID).refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: SahaSatisWidget
        embed: true

  SahaSatisWidget:
    type: app-extension
    platform: iOS
    sources:
      - SahaSatisWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/SahaSatisWidget-Info.plist
      properties:
        CFBundleDisplayName: Saha Satış
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/SahaSatisWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)

  SahaSatisTests:
    type: bundle.unit-test
    platform: iOS
    # Shared'ı derlemez: testler `@testable import SahaSatis` ile uygulamadaki tek kopyayı kullanır
    # (@Model sınıfları iki modülde tanımlanırsa SwiftData çalışma zamanında çakışır).
    sources:
      - SahaSatisTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SahaSatis

schemes:
  SahaSatis:
    build:
      targets:
        SahaSatis: all
        SahaSatisWidget: all
    run:
      config: Debug
    test:
      config: Debug
      # Test sırasında uygulama (host) bildirim izni istemesin / gerçek bildirim planlamasın.
      commandLineArguments:
        "-DebugNoNotifications": true
      targets:
        - SahaSatisTests
    profile:
      config: Release
    archive:
      config: Release

  # Mac'te iPhone'a kurarken bu şema seçilir.
  SahaSatis-FreeDevice:
    build:
      targets:
        SahaSatis: all
        SahaSatisWidget: all
    run:
      config: FreeDevice
    profile:
      config: FreeDevice
    analyze:
      config: FreeDevice
    archive:
      config: FreeDevice
