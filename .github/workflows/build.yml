name: Build

# Faz 0: imzasız, iPhone simülatörü için derleme + test + ekran görüntüleri.
# TestFlight adımı Apple Developer hesabı onaylanınca eklenecek.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini üret
        run: xcodegen generate

      - name: Simülatör seç ve aç
        id: sim
        run: |
          set -euo pipefail
          xcodebuild -version
          UDID=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1 | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "Uygun iPhone simülatörü bulunamadı" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Derle ve test et
        run: |
          set -euo pipefail
          mkdir -p artifacts/screenshots build
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/artifacts/screenshots" \
          xcodebuild test \
            -project SahaSatis.xcodeproj \
            -scheme SahaSatis \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath artifacts/Test.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/xcodebuild.log

      - name: Uygulama ekran görüntüsü
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find build/DerivedData/Build/Products -name 'SahaSatis.app' -maxdepth 2 | head -1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -AppleLanguages "(tr)" -AppleLocale tr_TR -DebugNoNotifications
          sleep 5
          xcrun simctl io "$UDID" screenshot artifacts/screenshots/app.png
          xcrun simctl ui "$UDID" appearance dark
          sleep 2
          xcrun simctl io "$UDID" screenshot artifacts/screenshots/app-dark.png
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # Müşteri ekranları: yalnızca DEBUG derlemesinde, bellek içi hayali örnek veriyle.
          for scene in installedBase installedBaseForm weekDay importMapping importPreview customers detail form settings settingsReminders settingsCities visitForm visitRecording visitHistory today todayForm export exportPreview opportunities opportunityDetail opportunityForm opportunityLost quotes quoteDetail quoteForm region regionCity regionDistrict; do
            for mode in light dark; do
              xcrun simctl ui "$UDID" appearance "$mode"
              xcrun simctl launch "$UDID" "$BUNDLE_ID" -AppleLanguages "(tr)" -AppleLocale tr_TR -DebugSampleData -DebugScene "$scene"
              sleep 5
              xcrun simctl io "$UDID" screenshot "artifacts/screenshots/screen-$scene-$mode.png"
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            done
          done
          xcrun simctl ui "$UDID" appearance light

      - name: Artifact yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: artifacts/
          if-no-files-found: warn
