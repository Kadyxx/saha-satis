name: Build

# Her push'ta: imzasız derleme + birim testleri (simülatör) ve FreeDevice yapılandırmasının cihaz derlemesi.
# Ekran görüntüleri ayrı iş akışında (screenshots.yml).
# TestFlight adımı Apple Developer hesabı onaylanınca eklenecek.

on:
  push:
    branches: ['**']
  # Aynı repodaki dalların push'u zaten çalışır; pull_request yalnızca fork'lardan gelen PR'lar için.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini üret
        run: xcodegen generate

      - name: Simülatör seç ve aç
        id: sim
        run: bash scripts/ci/boot-simulator.sh

      - name: Derle ve test et
        run: |
          set -euo pipefail
          mkdir -p artifacts build
          xcodebuild test \
            -project SahaSatis.xcodeproj \
            -scheme SahaSatis \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath artifacts/Test.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/xcodebuild.log

      - name: Artifact yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  freedevice:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini üret
        run: xcodegen generate

      - name: FreeDevice yapılandırmasını cihaz için derle (imzasız)
        run: |
          set -euo pipefail
          mkdir -p artifacts build
          xcodebuild build \
            -project SahaSatis.xcodeproj \
            -scheme SahaSatis-FreeDevice \
            -configuration FreeDevice \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/freedevice.log

      - name: Kimlikleri ve yetkileri doğrula
        run: bash scripts/ci/check-freedevice.sh build/DerivedData/Build/Products/FreeDevice-iphoneos/SahaSatis.app

      - name: Log yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freedevice-log
          path: artifacts/
          retention-days: 14
